# Every pod in the namespace: no traffic in or out unless another policy in
# this namespace allows it. (Policies only add: traffic is allowed when any
# policy selecting the pod allows it.)
#
# Not affected: the kubelet's probes from the pod's own node, which Dataplane
# V2 always allows, so startup, readiness and liveness probes keep working.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
