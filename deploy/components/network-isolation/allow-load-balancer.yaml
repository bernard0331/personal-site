# In: only the Gateway's load balancer, on the port named "http".
#
# With container-native load balancing the load balancer sends requests
# straight to the pod's IP, from Google's front-end proxies, and its health
# checks come from the same ranges. These are fixed, documented ranges (the
# VPC firewall rule in terraform/modules/network admits the same ones). Other
# pods, other namespaces and the rest of the VPC are refused.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-load-balancer
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 35.191.0.0/16
        - ipBlock:
            cidr: 130.211.0.0/22
      ports:
        - protocol: TCP
          port: http
