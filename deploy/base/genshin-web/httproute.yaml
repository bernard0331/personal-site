# Sends the Genshin site's hostname to the genshin-web Service. It attaches
# to the shared Gateway's HTTPS listener; GENSHIN_HOSTNAME is filled in by
# deploy/gke/apply.sh from Terraform's output.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: genshin-web
  namespace: genshin
spec:
  parentRefs:
    - name: sites
      namespace: gateway
      sectionName: https
  hostnames:
    - GENSHIN_HOSTNAME
  rules:
    - backendRefs:
        - name: genshin-web
          port: 80
