# Sends the site's hostname to the Service. It attaches to the shared
# Gateway's HTTPS listener; WWW_HOSTNAME is filled in by
# deploy/gke/apply.sh from Terraform's output.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home
  namespace: home
spec:
  parentRefs:
    - name: sites
      namespace: gateway
      sectionName: https
  hostnames:
    - WWW_HOSTNAME
  rules:
    - backendRefs:
        - name: home
          port: 80
