# How the load balancer checks the pods: GET /healthz on the serving port.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: home
  namespace: home
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_SERVING_PORT
        requestPath: /healthz
  targetRef:
    group: ""
    kind: Service
    name: home
