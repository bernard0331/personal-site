# The pod's identity.{{if .Bucket}} Terraform (modules/iam) grants it object read/write on
# the runs bucket through Workload Identity Federation for GKE: no key, no
# Google service account.{{else}} It has no Google Cloud access; set "bucket": true
# in terraform/envs/prod/services.json to grant it the runs bucket.{{end}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{.Name}}
  namespace: {{.Namespace}}
