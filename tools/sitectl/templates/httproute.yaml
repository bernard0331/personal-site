# Sends the site's hostname to the Service. It attaches to the shared
# Gateway's HTTPS listener; {{.HostPlaceholder}} is filled in by
# deploy/gke/apply.sh from Terraform's output.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{.Name}}
  namespace: {{.Namespace}}
spec:
  parentRefs:
    - name: sites
      namespace: gateway
      sectionName: https
  hostnames:
    - {{.HostPlaceholder}}
  rules:
    - backendRefs:
        - name: {{.Name}}
          port: 80
