# {{.Name}}: scaffolded by tools/sitectl. Change the image's arguments,
# resources and replicas to suit the service.
#
# The container must serve HTTP on port {{.Port}} and answer GET /healthz.
# The pod runs as a non-root user with no extra privileges.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Name}}
  namespace: {{.Namespace}}
  labels:
    app: {{.Name}}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: {{.Name}}
  template:
    metadata:
      labels:
        app: {{.Name}}
{{- if .Bucket}}
      annotations:
        # Inject the Cloud Storage FUSE sidecar that mounts the bucket.
        gke-gcsfuse/volumes: "true"
{{- end}}
    spec:
      serviceAccountName: {{.Name}}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{.Name}}
          image: {{.Name}} # the overlay sets the registry path and tag
          ports:
            - name: http
              containerPort: {{.Port}}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
{{- if .Bucket}}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # The runs bucket, only this service's folder of it. BUCKET_NAME is
        # filled in by deploy/gke/apply.sh.
        - name: data
          csi:
            driver: gcsfuse.csi.storage.gke.io
            volumeAttributes:
              bucketName: BUCKET_NAME
              mountOptions: "only-dir={{.Name}},implicit-dirs,uid=10001,gid=10001"
{{- end}}
